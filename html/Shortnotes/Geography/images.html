<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Visual Gallery</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent: #00a8ff;
            --modal-overlay: rgba(0, 0, 0, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            aspect-ratio: 4/3;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 168, 255, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .title-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 30px 15px 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            pointer-events: none;
        }

        /* Fullscreen Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            z-index: 1000;
            overflow: hidden;
            flex-direction: column;
        }

        /* Top Bar */
        .modal-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
            pointer-events: none; 
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--text-color);
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .controls {
            display: flex;
            gap: 12px;
            pointer-events: auto; 
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            user-select: none;
        }

        .control-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .control-btn.close {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.5);
        }

        .control-btn.close:hover {
            background: #ff3b30;
        }

        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        
        .nav-btn:hover { background: var(--accent); }
        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }

        /* Modal Body for Canvas */
        .modal-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            position: relative;
        }

        .modal-body:active {
            cursor: grabbing;
        }

        /* The Image */
        .modal-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none; 
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .modal-header { padding: 10px; flex-direction: column; gap: 10px; align-items: flex-start; }
            .modal-title { font-size: 1.2rem; }
            .control-btn { width: 38px; height: 38px; font-size: 1.1rem; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .modal-img { max-width: 100vw; max-height: 80vh; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Geographical Features</h1>
    </div>

    <div class="gallery" id="galleryContainer"></div>

    <div class="modal" id="imageModal">
        <button class="nav-btn nav-prev" onclick="changeImage(-1)" title="Previous Image">❮</button>
        <button class="nav-btn nav-next" onclick="changeImage(1)" title="Next Image">❯</button>

        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Image Title</div>
            <div class="controls">
                <button class="control-btn" onclick="openInNewTab()" title="Open in New Tab">↗</button>
                <button class="control-btn" onclick="rotateImage()" title="Rotate 90°">↻</button>
                <button class="control-btn" onclick="downloadImage()" title="Download">↓</button>
                <button class="control-btn" onclick="resetTransform()" title="Reset View">⛶</button>
                <button class="control-btn" onclick="zoomOutBtn()" title="Zoom Out">−</button>
                <button class="control-btn" onclick="zoomInBtn()" title="Zoom In">+</button>
                <button class="control-btn close" onclick="closeModal()" title="Close">×</button>
            </div>
        </div>

        <div class="modal-body" id="modalBody">
            <img class="modal-img" id="modalImage" src="" alt="Zoomed Image">
        </div>
    </div>

    <script>
        const imagesData = [
            { src: './images/drainage.jpg', fallback: './images/drainage.jpeg', title: 'Drainage System' },
            { src: './images/mountainOfPeninsular.jpg', fallback: './images/mountainOfPeninsular.jpeg', title: 'Peninsular Mountains' },
            { src: './images/plateau.jpg', fallback: './images/plateau.jpeg', title: 'Plateau Region' },
            { src: './images/coastal.jpg', fallback: './images/coastal.jpeg', title: 'Coastal Plains' },
            { src: './images/islands.jpg', fallback: './images/islands.jpeg', title: 'Islands' },
            // Added 5 Custom Images
            { src: './images/ganga.jpg', fallback: './images/ganga.jpeg', title: 'Ganga River System' },
            { src: './images/gangaOrigin.jpg', fallback: './images/gangaOrigin.jpeg', title: 'Origin of Ganga' },
            { src: './images/indus.jpg', fallback: './images/indus.jpeg', title: 'Indus River System' },
            { src: './images/brahmaputra.jpg', fallback: './images/brahmaputra.jpeg', title: 'Brahmaputra Basin' },
            { src: './images/peninsularRiver.jpg', fallback: './images/peninsularRiver.jpeg', title: 'Peninsular Rivers' }
        ];

        let currentIndex = 0;
        
        const galleryContainer = document.getElementById('galleryContainer');
        imagesData.forEach((imgObj, index) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.onclick = () => openModal(index);
            
            div.innerHTML = `
                <img src="${imgObj.src}" onerror="this.onerror=null; this.src='${imgObj.fallback}';" alt="${imgObj.title}">
                <div class="title-overlay">${imgObj.title}</div>
            `;
            galleryContainer.appendChild(div);
        });

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        let scale = 1;
        let pointX = 0, pointY = 0; 
        let rotation = 0;
        
        let isDragging = false;
        let startX, startY;

        function openModal(index) {
            currentIndex = index;
            modal.style.display = 'flex';
            loadImage(index);
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.style.display = 'none';
            modalImg.src = '';
            document.body.style.overflow = 'auto'; 
        }

        function loadImage(index) {
            const imgData = imagesData[index];
            modalTitle.textContent = imgData.title;
            
            const img = new Image();
            img.onload = () => { modalImg.src = img.src; };
            img.onerror = () => { modalImg.src = imgData.fallback; };
            img.src = imgData.src;

            resetTransform();
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = imagesData.length - 1;
            if (currentIndex >= imagesData.length) currentIndex = 0;
            loadImage(currentIndex);
        }

        function applyTransform() {
            modalImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale}) rotate(${rotation}deg)`;
        }

        function resetTransform() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            rotation = 0;
            applyTransform();
        }

        function rotateImage() {
            rotation += 90;
            applyTransform();
        }

        function openInNewTab() {
            window.open(modalImg.src, '_blank');
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = modalImg.src;
            link.download = imagesData[currentIndex].title + '.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function zoomInBtn() { executeZoom(1.5, window.innerWidth / 2, window.innerHeight / 2); }
        function zoomOutBtn() { executeZoom(1 / 1.5, window.innerWidth / 2, window.innerHeight / 2); }

        function executeZoom(zoomFactor, mouseClientX, mouseClientY) {
            let newScale = scale * zoomFactor;
            newScale = Math.max(0.2, Math.min(newScale, 15)); 
            
            const scaleChange = newScale / scale;
            
            const rect = modalBody.getBoundingClientRect();
            const mouseX = mouseClientX - rect.left - rect.width / 2;
            const mouseY = mouseClientY - rect.top - rect.height / 2;
            
            pointX = mouseX - (mouseX - pointX) * scaleChange;
            pointY = mouseY - (mouseY - pointY) * scaleChange;
            
            scale = newScale;
            applyTransform();
        }

        modalBody.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : (1 / 1.15); 
            executeZoom(zoomFactor, e.clientX, e.clientY);
        }, { passive: false });

        modalBody.addEventListener('dblclick', (e) => {
            e.preventDefault();
            if (scale > 1) {
                resetTransform();
            } else {
                executeZoom(2.5, e.clientX, e.clientY);
            }
        });

        modalBody.addEventListener('mousedown', (e) => {
            if(e.button !== 0) return; 
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // --- FIXED MOBILE TOUCH SUPPORT ---
        let initialPinchDistance = null;
        let initialPinchScale = 1;
        let lastTap = 0;

        modalBody.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                
                // Double tap logic ONLY triggers if it's 1 finger
                if (tapLength < 300 && tapLength > 0) {
                    if (scale > 1) {
                        resetTransform();
                    } else {
                        executeZoom(2.5, e.touches[0].clientX, e.touches[0].clientY);
                    }
                    lastTap = 0; // Clear so it doesn't loop
                } else {
                    lastTap = currentTime;
                }

                // Prepare for dragging
                isDragging = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
                
            } else if (e.touches.length === 2) {
                // Second finger touched: Cancel double tap to prevent the reset bug
                lastTap = 0; 
                
                // Prepare for pinching
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialPinchScale = scale;
                isDragging = false; 
            }
        });

        modalBody.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            
            if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                const zoomFactorMultiplier = currentDistance / initialPinchDistance;
                let targetScale = initialPinchScale * zoomFactorMultiplier;
                
                const incrementalRatio = targetScale / scale;
                
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                executeZoom(incrementalRatio, midX, midY);
                
            } else if (e.touches.length === 1 && isDragging) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                applyTransform();
            }
        }, { passive: false });

        modalBody.addEventListener('touchend', (e) => { 
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (e.touches.length === 1) {
                // Smooth transition: if you lift one finger after a pinch, 
                // the remaining finger can continue dragging without snapping.
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
                isDragging = true;
            } else {
                isDragging = false; 
            }
        });

        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'ArrowLeft') changeImage(-1);
            }
        });
    </script>
</body>
</html>
