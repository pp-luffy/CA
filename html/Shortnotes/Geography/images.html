<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Visual Gallery</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent: #00a8ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            aspect-ratio: 4/3;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 168, 255, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .title-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 20px 15px 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            pointer-events: none;
        }

        /* Fullscreen Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow: hidden;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            background: linear-gradient(rgba(0,0,0,0.8), transparent);
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .control-btn.close {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.5);
        }

        .control-btn.close:hover {
            background: #ff3b30;
        }

        .modal-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            overflow: auto; /* Allows scrolling when zoomed in */
        }

        .modal-body:active {
            cursor: grabbing;
        }

        .modal-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-origin: center center;
        }

        /* Hide scrollbars in modal */
        .modal-body::-webkit-scrollbar {
            display: none;
        }
        .modal-body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            .modal-header {
                padding: 15px;
            }
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .modal-img {
                max-width: 100vw;
                max-height: 80vh;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Geographical Features</h1>
    </div>

    <div class="gallery">
        <!-- Drainage Image -->
        <div class="gallery-item" onclick="openModal('./images/drainage.jpg', 'Drainage System')">
            <!-- Fallback to .jpeg if .jpg fails using onerror -->
            <img src="./images/drainage.jpg" onerror="this.onerror=null; this.src='./images/drainage.jpeg';" alt="Drainage">
            <div class="title-overlay">Drainage System</div>
        </div>

        <!-- Mountain of Peninsular Image -->
        <div class="gallery-item" onclick="openModal('./images/mountainOfPeninsular.jpg', 'Peninsular Mountains')">
            <img src="./images/mountainOfPeninsular.jpg" onerror="this.onerror=null; this.src='./images/mountainOfPeninsular.jpeg';" alt="Peninsular Mountains">
            <div class="title-overlay">Peninsular Mountains</div>
        </div>

        <!-- Plateau Image -->
        <div class="gallery-item" onclick="openModal('./images/plateau.jpg', 'Plateau Region')">
            <img src="./images/plateau.jpg" onerror="this.onerror=null; this.src='./images/plateau.jpeg';" alt="Plateau">
            <div class="title-overlay">Plateau Region</div>
        </div>

        <!-- Coastal Image -->
        <div class="gallery-item" onclick="openModal('./images/coastal.jpg', 'Coastal Plains')">
            <img src="./images/coastal.jpg" onerror="this.onerror=null; this.src='./images/coastal.jpeg';" alt="Coastal Plains">
            <div class="title-overlay">Coastal Plains</div>
        </div>
    </div>

    <!-- Fullscreen Zoom Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Image Title</div>
            <div class="controls">
                <button class="control-btn" onclick="zoomOut()" title="Zoom Out">−</button>
                <button class="control-btn" onclick="zoomIn()" title="Zoom In">+</button>
                <button class="control-btn close" onclick="closeModal()" title="Close">×</button>
            </div>
        </div>
        <div class="modal-body" id="modalBody">
            <img class="modal-img" id="modalImage" src="" alt="Zoomed Image">
        </div>
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        let currentScale = 1;
        const scaleStep = 0.5;
        const maxScale = 4;
        const minScale = 0.5;

        // Variables for drag functionality
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;

        function openModal(imageSrc, title) {
            modal.style.display = 'flex';
            
            // Allow the image to load first before assigning, keeping the fallback intact
            const img = new Image();
            img.onload = function() { modalImg.src = this.src; };
            img.onerror = function() { modalImg.src = imageSrc.replace('.jpg', '.jpeg'); };
            img.src = imageSrc;

            modalTitle.textContent = title;
            resetZoom();
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            modal.style.display = 'none';
            modalImg.src = '';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        function zoomIn() {
            if (currentScale < maxScale) {
                currentScale += scaleStep;
                applyTransform();
            }
        }

        function zoomOut() {
            if (currentScale > minScale) {
                currentScale -= scaleStep;
                applyTransform();
            }
        }

        function resetZoom() {
            currentScale = 1;
            applyTransform();
            modalBody.scrollLeft = 0;
            modalBody.scrollTop = 0;
        }

        function applyTransform() {
            modalImg.style.transform = `scale(${currentScale})`;
            
            // Adjust body display to allow scrolling when image scales beyond screen
            if(currentScale > 1) {
                modalImg.style.maxWidth = 'none';
                modalImg.style.maxHeight = 'none';
            } else {
                modalImg.style.maxWidth = '90vw';
                modalImg.style.maxHeight = '85vh';
            }
        }

        // Close modal on Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        // Mouse wheel zoom support
        modalBody.addEventListener('wheel', function(e) {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }, { passive: false });

        // Drag to pan functionality for zoomed images
        modalBody.addEventListener('mousedown', (e) => {
            if(currentScale <= 1) return;
            isDragging = true;
            startX = e.pageX - modalBody.offsetLeft;
            startY = e.pageY - modalBody.offsetTop;
            scrollLeft = modalBody.scrollLeft;
            scrollTop = modalBody.scrollTop;
        });

        modalBody.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        modalBody.addEventListener('mouseup', () => {
            isDragging = false;
        });

        modalBody.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - modalBody.offsetLeft;
            const y = e.pageY - modalBody.offsetTop;
            const walkX = (x - startX) * 2; // Scroll-fast multiplier
            const walkY = (y - startY) * 2;
            modalBody.scrollLeft = scrollLeft - walkX;
            modalBody.scrollTop = scrollTop - walkY;
        });

        // Touch support for dragging on mobile
        modalBody.addEventListener('touchstart', (e) => {
            if(currentScale <= 1) return;
            isDragging = true;
            startX = e.touches[0].pageX - modalBody.offsetLeft;
            startY = e.touches[0].pageY - modalBody.offsetTop;
            scrollLeft = modalBody.scrollLeft;
            scrollTop = modalBody.scrollTop;
        });

        modalBody.addEventListener('touchend', () => {
            isDragging = false;
        });

        modalBody.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].pageX - modalBody.offsetLeft;
            const y = e.touches[0].pageY - modalBody.offsetTop;
            const walkX = (x - startX) * 2;
            const walkY = (y - startY) * 2;
            modalBody.scrollLeft = scrollLeft - walkX;
            modalBody.scrollTop = scrollTop - walkY;
        });
    </script>
</body>
</html>
